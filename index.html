<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Automatica</title>
  <meta name="description" content="Human judgment. Structured intelligence.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .mark {
      width: 96px;
      height: 96px;
      margin-bottom: 2rem;
    }

    .mark svg {
      width: 100%;
      height: 100%;
    }

    .mark rect { display: none; }

    @keyframes colorwave {
      0%   { color: #e8e8e8; filter: drop-shadow(0 0 0px transparent); }
      20%  { color: #00E5FF; filter: drop-shadow(0 0 18px rgba(0,229,255,0.5)); }
      40%  { color: #C9A96E; filter: drop-shadow(0 0 18px rgba(201,169,110,0.4)); }
      60%  { color: #D4D8F0; filter: drop-shadow(0 0 18px rgba(212,216,240,0.4)); }
      80%  { color: #e8e8e8; filter: drop-shadow(0 0 0px transparent); }
      100% { color: #e8e8e8; filter: drop-shadow(0 0 0px transparent); }
    }

    .mark svg path {
      fill: currentColor;
    }

    .mark {
      animation: colorwave 8s ease-in-out infinite;
      animation-delay: 4s;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #e8e8e8;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 0.08em;
    }
  </style>
</head>
